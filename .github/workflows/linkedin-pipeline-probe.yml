name: LinkedIn Pipeline Probe

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkedin-pipeline-probe-registry
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pyyaml

      - name: Run end-to-end pipeline probe
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python engines/linkedin/run_pipeline_probe.py

      - name: Persist registry
        if: always()
        run: |
          if [ -f data/pipeline_probe_registry.json ]; then
            git config user.name "job-radar-bot"
            git config user.email "job-radar-bot@users.noreply.github.com"
            git add data/pipeline_probe_registry.json
            if ! git diff --cached --quiet; then
              git commit -m "Persist LinkedIn pipeline probe registry"
              git push
            fi
          fi
