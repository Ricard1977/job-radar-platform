name: Evaluate Jobs with AI

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum unevaluated jobs to process"
        required: false
        default: "25"

permissions:
  contents: write

concurrency:
  group: job-radar-ai-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openai pyyaml

      - name: Evaluate unevaluated jobs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JOB_RADAR_AI_MODEL: gpt-5.6-luna
          JOB_RADAR_AI_LIMIT: ${{ inputs.limit }}
          PYTHONPATH: ${{ github.workspace }}
        run: python ai/evaluate_jobs.py

      - name: Persist AI evaluations
        if: success()
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add data/job_radar.db
          if ! git diff --cached --quiet; then
            git commit -m "Add AI job evaluations"
            git push
          fi
