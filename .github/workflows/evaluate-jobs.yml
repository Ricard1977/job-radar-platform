name: Evaluate Jobs with Gemini

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum unevaluated jobs to process"
        required: false
        default: "100"

permissions:
  contents: write

concurrency:
  group: job-radar-ai-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Evaluate unevaluated jobs with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JOB_RADAR_AI_MODEL: gemini-3.5-flash-lite
          JOB_RADAR_AI_LIMIT: ${{ inputs.limit }}
          PYTHONPATH: ${{ github.workspace }}
        run: python ai/evaluate_jobs.py

      - name: Sync AI evaluations to Supabase
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python db/migrate_sqlite_to_supabase.py

      - name: Build safe frontend snapshot
        if: success()
        run: python frontend/export_dashboard.py

      - name: Persist AI evaluations and dashboard snapshot
        if: success()
        shell: bash
        run: |
          set -e
          cp data/job_radar.db /tmp/job_radar.db
          cp docs/data/jobs.json /tmp/jobs.json
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/job_radar.db data/job_radar.db
            cp /tmp/jobs.json docs/data/jobs.json
            git add data/job_radar.db docs/data/jobs.json
            if git diff --cached --quiet; then
              echo "AI evaluations already persisted."
              exit 0
            fi
            git commit -m "Add Gemini job evaluations and dashboard snapshot"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo "Could not persist AI evaluations after 5 attempts."
          exit 1
