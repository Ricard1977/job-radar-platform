name: Evaluate Jobs with Gemini

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum unevaluated jobs to process"
        required: false
        default: "10"

permissions:
  contents: write

concurrency:
  group: job-radar-ai-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Evaluate unevaluated jobs with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JOB_RADAR_AI_MODEL: gemini-3.5-flash-lite
          JOB_RADAR_AI_LIMIT: ${{ inputs.limit }}
          PYTHONPATH: ${{ github.workspace }}
        run: python ai/evaluate_jobs.py

      - name: Persist AI evaluations
        if: success()
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add data/job_radar.db
          if ! git diff --cached --quiet; then
            git commit -m "Add Gemini job evaluations"
            git push
          fi
