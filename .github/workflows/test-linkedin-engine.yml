name: Test LinkedIn Engine

on:
  push:
    paths:
      - "engines/linkedin/**"
      - "requirements.txt"
      - ".github/workflows/test-linkedin-engine.yml"
  pull_request:
    paths:
      - "engines/linkedin/**"
      - "requirements.txt"
      - ".github/workflows/test-linkedin-engine.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run LinkedIn Engine tests
        run: python -m pytest engines/linkedin/tests -q
