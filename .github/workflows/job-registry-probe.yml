name: Job Registry Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test registry repeatability
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/probe_job_registry.py
