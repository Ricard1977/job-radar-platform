name: LinkedIn Job Radar

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linkedin-job-radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pyyaml

      - name: Run LinkedIn pipeline
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python engines/linkedin/run.py

      - name: Persist operational registry
        if: always()
        run: |
          if [ -f data/job_registry.json ]; then
            git config user.name "job-radar-bot"
            git config user.email "job-radar-bot@users.noreply.github.com"
            git add data/job_registry.json
            if ! git diff --cached --quiet; then
              git commit -m "Update operational job registry"
              git push
            fi
          fi
