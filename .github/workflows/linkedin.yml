name: LinkedIn Job Radar

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. Two entries keep the run at 06:00 Europe/Madrid
    # across CET/CEST; the job-level timezone guard below allows only local 06:00.
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"

permissions:
  contents: write

concurrency:
  group: linkedin-job-radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Guard scheduled run to 06:00 Europe/Madrid
        id: schedule_guard
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=Europe/Madrid date +%H)" = "06" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.schedule_guard.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.schedule_guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.schedule_guard.outputs.run == 'true'
        run: pip install requests beautifulsoup4 pyyaml

      - name: Run LinkedIn pipeline
        if: steps.schedule_guard.outputs.run == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python engines/linkedin/run.py

      - name: Persist operational database
        if: always() && steps.schedule_guard.outputs.run == 'true'
        shell: bash
        run: |
          set -e
          if [ -f data/job_radar.db ]; then
            cp data/job_radar.db /tmp/job_radar.db
            git config user.name "job-radar-bot"
            git config user.email "job-radar-bot@users.noreply.github.com"

            # main can change while the 4+ minute extraction is running.
            # Retry from the newest main while always restoring this run's DB.
            for attempt in 1 2 3 4 5; do
              echo "Persist attempt $attempt/5"
              git fetch origin main
              git reset --hard origin/main
              cp /tmp/job_radar.db data/job_radar.db
              git add data/job_radar.db

              if git diff --cached --quiet; then
                echo "Operational database already persisted."
                exit 0
              fi

              git commit -m "Update operational Job Radar database"
              if git push origin HEAD:main; then
                echo "Operational database persisted successfully."
                exit 0
              fi

              echo "main changed during push; retrying on latest main..."
              sleep $((attempt * 2))
            done

            echo "Could not persist operational database after 5 attempts."
            exit 1
          fi
