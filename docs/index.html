<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Radar</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}h1{margin:0;font-size:28px}.muted{color:#687386}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat,.card{background:white;border:1px solid #e3e8f0;border-radius:14px}.stat{padding:16px}.stat b{display:block;font-size:25px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.toolbar button{border:1px solid #d8deea;background:white;padding:9px 13px;border-radius:999px;cursor:pointer}.toolbar button.active{background:#172033;color:white}.card{padding:20px;margin:12px 0}.top{display:flex;justify-content:space-between;gap:18px}.score{font-size:27px;font-weight:750;min-width:54px}.badge{font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;background:#eef1f6}.title{font-size:19px;font-weight:700;margin:4px 0}.company{font-weight:600}.meta,.reason{color:#5d687b;margin-top:8px}.reason{line-height:1.45}.actions{margin-top:15px}.actions a{display:inline-block;text-decoration:none;background:#172033;color:white;padding:9px 12px;border-radius:8px}.empty{text-align:center;padding:50px;color:#687386}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}header{display:block}.top{display:block}.score{margin-bottom:8px}}
</style></head><body><div class="wrap"><header><div><h1>Job Radar</h1><div class="muted">Oportunidades priorizadas automáticamente</div></div><div id="updated" class="muted"></div></header><div class="stats"><div class="stat"><b id="total">–</b>Analizadas</div><div class="stat"><b id="high">–</b>Alta prioridad</div><div class="stat"><b id="interesting">–</b>Interesantes</div><div class="stat"><b id="review">–</b>Revisar</div></div><div class="toolbar" id="filters"></div><main id="list"><div class="empty">Cargando ofertas…</div></main></div><script>
const labels={ALL:'Todas',HIGH_INTEREST:'Alta prioridad',INTERESTING:'Interesantes',REVIEW:'Revisar',LOW_INTEREST:'Bajo interés'};let data=[],active='ALL';
function render(){const list=document.querySelector('#list');const rows=active==='ALL'?data:data.filter(x=>x.decision===active);list.innerHTML=rows.length?'':'<div class="empty">No hay ofertas en esta categoría.</div>';for(const j of rows){const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="top"><div><div class="badge">${labels[j.decision]||j.decision||'Sin clasificar'}</div><div class="title">${esc(j.title||'Sin título')}</div><div class="company">${esc(j.company||'')}</div><div class="meta">${esc([j.location,j.workplace_type,j.salary].filter(Boolean).join(' · '))}</div></div><div class="score">${Math.round(j.score||0)}</div></div><div class="reason">${esc(j.reason||'')}</div><div class="actions">${j.url?`<a href="${esc(j.url)}" target="_blank" rel="noopener">Ver oferta</a>`:''}</div>`;list.appendChild(el)}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
fetch('data/jobs.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{data=x.jobs||[];document.querySelector('#total').textContent=data.length;document.querySelector('#high').textContent=data.filter(j=>j.decision==='HIGH_INTEREST').length;document.querySelector('#interesting').textContent=data.filter(j=>j.decision==='INTERESTING').length;document.querySelector('#review').textContent=data.filter(j=>j.decision==='REVIEW').length;document.querySelector('#updated').textContent='Actualizado: '+new Date(x.generated_at).toLocaleString('es-ES');const f=document.querySelector('#filters');for(const k of Object.keys(labels)){const b=document.createElement('button');b.textContent=labels[k];b.className=k==='ALL'?'active':'';b.onclick=()=>{active=k;[...f.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');render()};f.appendChild(b)}render()}).catch(()=>document.querySelector('#list').innerHTML='<div class="empty">Todavía no se ha generado el snapshot del dashboard.</div>');
</script></body></html>
