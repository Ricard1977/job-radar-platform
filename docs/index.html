<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Radar</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:30px 18px}header{display:flex;justify-content:space-between;align-items:end;gap:20px}h1{margin:0;font-size:30px}.muted{color:#687386}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat,.card,.login{background:#fff;border:1px solid #e1e6ef;border-radius:15px}.stat{padding:16px}.stat b{display:block;font-size:26px}.toolbar,.actions,.quick{display:flex;gap:8px;flex-wrap:wrap}.toolbar{margin:10px 0 18px}.toolbar button,.quick button{border:1px solid #d6dce7;background:#fff;padding:9px 13px;border-radius:999px;cursor:pointer}.toolbar button.active,.quick button.selected{background:#172033;color:#fff}.filter-title{font-size:12px;font-weight:700;color:#7b8493;margin-top:16px}.card{padding:21px;margin:13px 0}.top{display:flex;justify-content:space-between;gap:20px}.score{font-size:29px;font-weight:800}.badge{display:inline-block;font-size:12px;font-weight:750;padding:5px 9px;border-radius:999px;background:#edf1f6}.userbadge{margin-left:5px;background:#e9f5ed}.title{font-size:20px;font-weight:750;margin:6px 0}.company{font-weight:650}.meta,.reason{color:#5f697a;margin-top:8px}.reason{line-height:1.5}.quick{margin-top:14px;padding:11px 0;border-top:1px solid #edf0f4;border-bottom:1px solid #edf0f4}.quick .danger{border-color:#e2b8b8}.quick .delete{background:#8d3030;color:#fff;border-color:#8d3030}.actions{margin-top:14px}.btn{border:0;background:#172033;color:#fff;padding:9px 13px;border-radius:8px;text-decoration:none;cursor:pointer}.btn.secondary{background:#eef1f6;color:#172033}.detail{display:none;border-top:1px solid #e5e9f0;margin-top:18px;padding-top:18px}.detail.open{display:block}.detail h3{font-size:15px;margin:18px 0 7px}.detail p,.detail li{line-height:1.55}.desc{white-space:pre-wrap;max-height:420px;overflow:auto;background:#f7f8fb;padding:15px;border-radius:10px}.dimensions{display:flex;gap:7px;flex-wrap:wrap}.dim{background:#f2f4f8;border-radius:8px;padding:7px 9px;font-size:13px}.note{font-size:12px;color:#7b8493;margin-top:6px}.empty{text-align:center;padding:50px;color:#687386}.login{max-width:430px;margin:70px auto;padding:28px}.login h2{margin-top:0}.login input{width:100%;padding:12px;margin:7px 0;border:1px solid #d6dce7;border-radius:9px;font:inherit}.login button{width:100%;margin-top:10px}.login-error{color:#a02b2b;margin-top:10px;font-size:13px}.session{display:flex;align-items:center;gap:10px}.session button{border:0;background:none;cursor:pointer;color:#687386}#app{display:none}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}header,.top{display:block}.score{margin-top:10px}}</style></head><body><div class="wrap"><section id="login" class="login"><h2>Job Radar</h2><p class="muted">Accede a tu radar laboral.</p><input id="email" type="email" placeholder="Email" autocomplete="username"><input id="password" type="password" placeholder="Contraseña" autocomplete="current-password"><button class="btn" onclick="login()">Entrar</button><div id="loginError" class="login-error"></div></section><div id="app"><header><div><h1>Job Radar</h1><div class="muted">Oportunidades priorizadas para tu revisión</div></div><div class="session"><span id="sessionEmail" class="muted"></span><button onclick="logout()">Salir</button></div></header><div class="stats"><div class="stat"><b id="total">–</b>Ofertas</div><div class="stat"><b id="high">–</b>Muy interesantes</div><div class="stat"><b id="interesting">–</b>Interesantes IA</div><div class="stat"><b id="review">–</b>Revisar</div></div><div class="filter-title">MIS FILTROS</div><div class="toolbar" id="userFilters"></div><div class="filter-title">ENCAJE IA</div><div class="toolbar" id="aiFilters"></div><main id="list"><div class="empty">Cargando ofertas…</div></main></div></div><script>
const SUPABASE_URL='https://auiafqbsgxwfevlbypdf.supabase.co',SUPABASE_KEY='sb_publishable_eOXS4XJG4ax9Kg-Qs3PP9A_Rg34TQ25';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const aiLabels={ALL:'Todas',HIGH_INTEREST:'🔥 Muy interesante',INTERESTING:'✅ Interesante',REVIEW:'🤔 Revisar',LOW_INTEREST:'⬇ Bajo interés'},userLabels={ALL:'Todas',MY_INTEREST:'❤️ Me interesa',APPLIED:'✓ He aplicado'};let data=[],aiActive='ALL',userActive='ALL',state={};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const listHtml=a=>a?.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<span class="muted">Sin observaciones.</span>';function s(id){return state[id]||(state[id]={interest:null,applied:false})}function userMatch(j){const u=s(j.id);return userActive==='ALL'||(userActive==='MY_INTEREST'&&u.interest==='yes')||(userActive==='APPLIED'&&u.applied===true)}
async function login(){loginError.textContent='';const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){loginError.textContent='No se ha podido iniciar sesión.';return}await boot()}async function logout(){await sb.auth.signOut();app.style.display='none';login.style.display='block';password.value=''}
function latestEval(evals){if(!evals?.length)return null;return [...evals].sort((a,b)=>String(b.evaluated_at).localeCompare(String(a.evaluated_at)))[0]}function parseEval(j,e){let strengths=e?.strengths||[],weak=e?.weaknesses||{},reason=e?.reasoning||{};if(typeof strengths==='string')try{strengths=JSON.parse(strengths)}catch{}if(typeof weak==='string')try{weak=JSON.parse(weak)}catch{}if(typeof reason==='string')try{reason=JSON.parse(reason)}catch{}return{id:String(j.id),title:j.title,company:j.companies?.name||'',location:j.location,workplace_type:j.workplace_type,salary:j.salary_text,description:j.description,source:j.job_sources?.[0]?.sources?.name||'',url:j.job_sources?.[0]?.source_url||'',decision:e?.decision||null,score:e?.score||0,reason:reason?.short_reason||'',strengths:Array.isArray(strengths)?strengths:[],gaps:weak?.gaps_or_risks||[],barriers:weak?.hard_barriers||[],dimensions:e?{'Responsabilidad y seniority':e.seniority_match,'Project / Program':e.profile_match,'Entorno técnico':e.technical_match,'Liderazgo':e.management_match,'Sector':e.sector_match}: {}}}
async function loadData(){list.innerHTML='<div class="empty">Cargando ofertas desde Supabase…</div>';const {data:jobs,error}=await sb.from('jobs').select('id,title,location,workplace_type,description,salary_text,companies(name),job_sources(source_url,sources(name)),ai_evaluations(*)').order('id',{ascending:false});if(error){list.innerHTML='<div class="empty">Error leyendo Supabase: '+esc(error.message)+'</div>';return}const {data:feedback}=await sb.from('user_job_feedback').select('job_id,interest,applied');state={};for(const f of feedback||[])state[String(f.job_id)]={interest:f.interest==='INTERESTED'?'yes':f.interest==='NOT_INTERESTED'?'no':null,applied:!!f.applied};data=(jobs||[]).map(j=>parseEval(j,latestEval(j.ai_evaluations)));total.textContent=data.length;high.textContent=data.filter(j=>j.decision==='HIGH_INTEREST').length;interesting.textContent=data.filter(j=>j.decision==='INTERESTING').length;review.textContent=data.filter(j=>j.decision==='REVIEW').length;render()}
function render(){const rows=data.filter(x=>(aiActive==='ALL'||x.decision===aiActive)&&userMatch(x));list.innerHTML=rows.length?'':'<div class="empty">No hay ofertas con estos filtros.</div>';for(const j of rows){const id=esc(j.id),u=s(j.id),dims=Object.entries(j.dimensions||{}).filter(x=>x[1]!=null).map(([k,v])=>`<span class="dim">${esc(k)}: <b>${Math.round(v)}</b></span>`).join(''),badges=(u.interest==='yes'?'<span class="badge userbadge">♥ Me interesa</span>':'')+(u.applied?'<span class="badge userbadge">✓ Aplicada</span>':'');const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="top"><div><span class="badge">${aiLabels[j.decision]||'Sin evaluación IA'}</span>${badges}<div class="title">${esc(j.title||'Sin título')}</div><div class="company">${esc(j.company||'')}</div><div class="meta">${esc([j.location,j.workplace_type,j.salary,j.source].filter(Boolean).join(' · '))}</div></div><div><div class="score">${j.decision?Math.round(j.score||0):'–'}</div><div class="note">encaje / 100</div></div></div><div class="reason">${esc(j.reason||'')}</div><div class="quick"><button class="${u.interest==='yes'?'selected':''}" disabled>♥ Me interesa</button><button class="danger ${u.interest==='no'?'selected':''}" disabled>No me interesa</button><button class="${u.applied?'selected':''}" disabled>✓ He aplicado</button></div><div class="actions"><button class="btn" onclick="toggle('${id}')">Ver ficha completa</button>${j.url?`<a class="btn secondary" href="${esc(j.url)}" target="_blank" rel="noopener">Abrir oferta original</a>`:''}</div><div class="detail" id="d-${id}"><h3>Análisis de encaje</h3><div class="dimensions">${dims}</div><h3>Puntos fuertes</h3>${listHtml(j.strengths)}<h3>Riesgos o gaps</h3>${listHtml(j.gaps)}<h3>Barreras</h3>${listHtml(j.barriers)}<h3>Descripción original de la oferta</h3><div class="desc">${esc(j.description||'Descripción no disponible.')}</div></div>`;list.appendChild(el)}}function toggle(id){document.querySelector('#d-'+id)?.classList.toggle('open')}function makeFilters(el,obj,setter){el.innerHTML='';for(const k of Object.keys(obj)){const b=document.createElement('button');b.textContent=obj[k];b.className=k==='ALL'?'active':'';b.onclick=()=>{[...el.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');setter(k);render()};el.appendChild(b)}}async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){login.style.display='block';app.style.display='none';return}login.style.display='none';app.style.display='block';sessionEmail.textContent=session.user.email||'';makeFilters(userFilters,userLabels,k=>userActive=k);makeFilters(aiFilters,aiLabels,k=>aiActive=k);await loadData()}boot();
</script></body></html>
