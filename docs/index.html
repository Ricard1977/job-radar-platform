<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Radar</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:30px 18px}header{display:flex;justify-content:space-between;align-items:end;gap:20px}h1{margin:0;font-size:30px}.muted{color:#687386}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat,.card{background:#fff;border:1px solid #e1e6ef;border-radius:15px}.stat{padding:16px}.stat b{display:block;font-size:26px}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.toolbar{margin:12px 0}.toolbar button,.choice button{border:1px solid #d6dce7;background:#fff;padding:9px 13px;border-radius:999px;cursor:pointer}.toolbar button.active,.choice button.selected{background:#172033;color:#fff}.filter-title{font-size:12px;font-weight:700;color:#7b8493;margin-top:18px}.card{padding:21px;margin:13px 0}.top{display:flex;justify-content:space-between;gap:20px}.score{font-size:29px;font-weight:800}.badge{display:inline-block;font-size:12px;font-weight:750;padding:5px 9px;border-radius:999px;background:#edf1f6}.userbadge{margin-left:5px;background:#e9f5ed}.title{font-size:20px;font-weight:750;margin:6px 0}.company{font-weight:650}.meta,.reason{color:#5f697a;margin-top:8px}.reason{line-height:1.5}.btn{border:0;background:#172033;color:#fff;padding:9px 13px;border-radius:8px;text-decoration:none;cursor:pointer}.btn.secondary{background:#eef1f6;color:#172033}.detail{display:none;border-top:1px solid #e5e9f0;margin-top:18px;padding-top:18px}.detail.open{display:block}.detail h3{font-size:15px;margin:18px 0 7px}.detail p,.detail li{line-height:1.55}.desc{white-space:pre-wrap;max-height:420px;overflow:auto;background:#f7f8fb;padding:15px;border-radius:10px}.dimensions{display:flex;gap:7px;flex-wrap:wrap}.dim{background:#f2f4f8;border-radius:8px;padding:7px 9px;font-size:13px}.feedback{margin-top:18px;padding:16px;background:#fafbfc;border-radius:10px}.feedback-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.choice{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.note{font-size:12px;color:#7b8493;margin-top:6px}.why{display:none;margin-top:15px;padding-top:13px;border-top:1px solid #e5e9f0}.why.show{display:block}.why select,.why textarea{width:100%;margin-top:7px;padding:9px;border:1px solid #d6dce7;border-radius:8px;font:inherit}.why textarea{min-height:65px}.saved{font-size:12px;color:#4c6b55;margin-left:8px}.empty{text-align:center;padding:50px;color:#687386}@media(max-width:700px){.stats,.feedback-grid{grid-template-columns:1fr 1fr}header,.top{display:block}.score{margin-top:10px}}@media(max-width:520px){.feedback-grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header><div><h1>Job Radar</h1><div class="muted">Oportunidades priorizadas para tu revisión</div></div><div id="updated" class="muted"></div></header><div class="stats"><div class="stat"><b id="total">–</b>Analizadas</div><div class="stat"><b id="high">–</b>Muy interesantes</div><div class="stat"><b id="interesting">–</b>Interesantes</div><div class="stat"><b id="review">–</b>Revisar</div></div><div class="filter-title">ENCAJE IA</div><div class="toolbar" id="filters"></div><div class="filter-title">CANDIDATURA</div><div class="toolbar" id="applicationFilters"></div><main id="list"><div class="empty">Cargando ofertas…</div></main></div><script>
const labels={ALL:'Todas',HIGH_INTEREST:'🔥 Muy interesante',INTERESTING:'✅ Interesante',REVIEW:'🤔 Revisar',LOW_INTEREST:'⬇ Bajo interés'},appLabels={ALL:'Todas',APPLIED:'✅ Aplicadas',NOT_APPLIED:'❌ No aplicadas',UNDECIDED:'Sin marcar'};let data=[],active='ALL',appActive='ALL';const state=JSON.parse(localStorage.getItem('jobRadarUserState')||'{}');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const listHtml=a=>a?.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<span class="muted">Sin observaciones.</span>';function s(id){return state[id]||(state[id]={interest:null,applied:null,reason:'',note:'',applied_at:null})}function persist(){localStorage.setItem('jobRadarUserState',JSON.stringify(state))}function needWhy(x){return(x.interest==='yes'&&x.applied===false)||(x.interest==='maybe'&&x.applied===true)||(x.interest==='no'&&x.applied===true)}function appMatch(j){const a=s(j.id).applied;return appActive==='ALL'||(appActive==='APPLIED'&&a===true)||(appActive==='NOT_APPLIED'&&a===false)||(appActive==='UNDECIDED'&&a===null)}
function render(){const list=document.querySelector('#list'),rows=data.filter(x=>(active==='ALL'||x.decision===active)&&appMatch(x));list.innerHTML=rows.length?'':'<div class="empty">No hay ofertas con estos filtros.</div>';for(const j of rows){const id=esc(j.id),u=s(j.id),dims=Object.entries(j.dimensions||{}).filter(x=>x[1]!=null).map(([k,v])=>`<span class="dim">${esc(k)}: <b>${Math.round(v)}</b></span>`).join(''),appBadge=u.applied===true?'<span class="badge userbadge">✓ Aplicada</span>':u.applied===false?'<span class="badge">No aplicada</span>':'';const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="top"><div><span class="badge">${labels[j.decision]||'Sin clasificar'}</span>${appBadge}<div class="title">${esc(j.title||'Sin título')}</div><div class="company">${esc(j.company||'')}</div><div class="meta">${esc([j.location,j.workplace_type,j.salary,j.source].filter(Boolean).join(' · '))}</div></div><div><div class="score">${Math.round(j.score||0)}</div><div class="note">encaje / 100</div></div></div><div class="reason">${esc(j.reason||'')}</div><div class="actions"><button class="btn" onclick="toggle('${id}')">Ver ficha completa</button>${j.url?`<a class="btn secondary" href="${esc(j.url)}" target="_blank" rel="noopener">Abrir oferta original</a>`:''}</div><div class="detail" id="d-${id}"><h3>Resumen en castellano</h3><p>${esc(j.spanish_summary||'Se generará en la próxima evaluación.')}</p><h3>Análisis de encaje</h3><div class="dimensions">${dims}</div><h3>Puntos fuertes</h3>${listHtml(j.strengths)}<h3>Riesgos o gaps</h3>${listHtml(j.gaps)}<h3>Barreras</h3>${listHtml(j.barriers)}<h3>Descripción original</h3><div class="desc">${esc(j.description||'Descripción no disponible.')}</div><div class="feedback"><div class="feedback-grid"><div><b>1. ¿Qué te parece la posición?</b><div class="choice">${[['yes','👍 Me interesa'],['maybe','🤔 Dudosa'],['no','👎 No me interesa']].map(([v,t])=>`<button class="${u.interest===v?'selected':''}" onclick="interest('${id}','${v}')">${t}</button>`).join('')}</div></div><div><b>2. ¿Has aplicado?</b><div class="choice"><button class="${u.applied===true?'selected':''}" onclick="applied('${id}',true)">✅ Sí, he aplicado</button><button class="${u.applied===false?'selected':''}" onclick="applied('${id}',false)">❌ No he aplicado</button></div>${u.applied_at?`<div class="note">Aplicación registrada: ${esc(new Date(u.applied_at).toLocaleDateString('es-ES'))}</div>`:''}</div></div><div class="why ${needWhy(u)?'show':''}"><b>${u.interest==='yes'&&!u.applied?'Te interesa pero no has aplicado. ¿Qué te ha frenado?':u.interest==='maybe'&&u.applied?'Era dudosa pero has aplicado. ¿Qué te hizo hacerlo?':'No te interesa pero has aplicado. ¿Por qué?'}</b><select onchange="reason('${id}',this.value)"><option value="">Selecciona motivo…</option>${['Salario','Ubicación / presencialidad','Empresa','Idioma','Requisitos','Seniority','Contenido del puesto','Oportunidad estratégica','Networking','Mercado / pocas alternativas','Oferta ya no disponible','Otro'].map(v=>`<option ${u.reason===v?'selected':''}>${v}</option>`).join('')}</select><textarea placeholder="Comentario opcional…" onchange="note('${id}',this.value)">${esc(u.note||'')}</textarea><span class="saved">Se utilizará para aprender de tus decisiones.</span></div><div class="note">Por ahora estos datos se guardan en este navegador.</div></div></div>`;list.appendChild(el)}}function reopen(id){render();document.querySelector('#d-'+id)?.classList.add('open')}function toggle(id){document.querySelector('#d-'+id)?.classList.toggle('open')}function interest(id,v){s(id).interest=v;persist();reopen(id)}function applied(id,v){const x=s(id);x.applied=v;if(v&&!x.applied_at)x.applied_at=new Date().toISOString();if(!v)x.applied_at=null;persist();reopen(id)}function reason(id,v){s(id).reason=v;persist()}function note(id,v){s(id).note=v;persist()}
function makeFilters(el,obj,setter){for(const k of Object.keys(obj)){const b=document.createElement('button');b.textContent=obj[k];b.className=k==='ALL'?'active':'';b.onclick=()=>{[...el.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');setter(k);render()};el.appendChild(b)}}fetch('data/jobs.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{data=x.jobs||[];total.textContent=data.length;high.textContent=data.filter(j=>j.decision==='HIGH_INTEREST').length;interesting.textContent=data.filter(j=>j.decision==='INTERESTING').length;review.textContent=data.filter(j=>j.decision==='REVIEW').length;updated.textContent='Actualizado: '+new Date(x.generated_at).toLocaleString('es-ES');makeFilters(filters,labels,k=>active=k);makeFilters(applicationFilters,appLabels,k=>appActive=k);render()}).catch(()=>list.innerHTML='<div class="empty">No se pudo cargar el dashboard.</div>');</script></body></html>
