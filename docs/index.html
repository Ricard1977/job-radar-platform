<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Radar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:30px 18px}header{display:flex;justify-content:space-between;align-items:end;gap:20px}h1{margin:0;font-size:30px}.muted{color:#687386}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat,.card,.loginbox{background:#fff;border:1px solid #e1e6ef;border-radius:15px}.stat{padding:16px}.stat b{display:block;font-size:26px}.filter-panel{position:sticky;top:0;z-index:20;background:rgba(244,246,250,.96);backdrop-filter:blur(8px);padding:10px 0 8px;border-bottom:1px solid #e1e6ef}.toolbar,.actions,.quick{display:flex;gap:8px;flex-wrap:wrap}.toolbar{margin:7px 0 10px}.toolbar button,.quick button{border:1px solid #d6dce7;background:#fff;padding:9px 13px;border-radius:999px;cursor:pointer}.toolbar button.active,.quick button.selected{background:#172033;color:#fff}.quick button:disabled{opacity:.55;cursor:wait}.filter-title{font-size:12px;font-weight:700;color:#7b8493;margin-top:7px}.result-count{font-size:14px;font-weight:700;margin:6px 0 2px}.card{padding:21px;margin:13px 0}.top{display:flex;justify-content:space-between;gap:20px}.score{font-size:29px;font-weight:800}.badge{display:inline-block;font-size:12px;font-weight:750;padding:5px 9px;border-radius:999px;background:#edf1f6}.userbadge{margin-left:5px;background:#e9f5ed}.title{font-size:20px;font-weight:750;margin:6px 0}.company{font-weight:650}.meta,.reason{color:#5f697a;margin-top:8px}.reason{line-height:1.5}.quick{margin-top:14px;padding:11px 0;border-top:1px solid #edf0f4;border-bottom:1px solid #edf0f4}.quick .danger{border-color:#e2b8b8}.rejectbox{display:none;margin:12px 0 4px;padding:13px;background:#fff7f7;border:1px solid #ead2d2;border-radius:10px}.rejectbox.open{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.rejectbox input{flex:1;min-width:240px;padding:10px 12px;border:1px solid #d8c6c6;border-radius:8px;font:inherit}.deletebtn{border:0;background:#8d3030;color:#fff;padding:10px 14px;border-radius:8px;cursor:pointer}.deletebtn:disabled{opacity:.55;cursor:wait}.actions{margin-top:14px}.btn{border:0;background:#172033;color:#fff;padding:10px 13px;border-radius:8px;text-decoration:none;cursor:pointer}.btn.secondary{background:#eef1f6;color:#172033}.detail{display:none;border-top:1px solid #e5e9f0;margin-top:18px;padding-top:18px}.detail.open{display:block}.detail h3{font-size:15px;margin:18px 0 7px}.detail p,.detail li{line-height:1.55}.desc{white-space:pre-wrap;max-height:420px;overflow:auto;background:#f7f8fb;padding:15px;border-radius:10px}.dimensions{display:flex;gap:7px;flex-wrap:wrap}.dim{background:#f2f4f8;border-radius:8px;padding:7px 9px;font-size:13px}.note{font-size:12px;color:#7b8493;margin-top:6px}.empty{text-align:center;padding:50px;color:#687386}.loginbox{max-width:430px;margin:70px auto;padding:28px}.loginbox h2{margin-top:0}.loginbox input{width:100%;padding:12px;margin:7px 0;border:1px solid #d6dce7;border-radius:9px;font:inherit}.loginbox button{width:100%;margin-top:10px}.login-msg{margin-top:11px;font-size:13px;min-height:18px}.error{color:#a02b2b}.session{display:flex;align-items:center;gap:10px}.session button{border:0;background:none;cursor:pointer;color:#687386}#app{display:none}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}header,.top{display:block}.score{margin-top:10px}.rejectbox.open{display:block}.rejectbox input,.deletebtn{width:100%;margin-top:6px}.filter-panel{top:0}}
</style>
</head>
<body>
<div class="wrap">
<section id="loginPanel" class="loginbox"><h2>Job Radar</h2><p class="muted">Accede a tu radar laboral.</p><form id="loginForm"><input id="loginEmail" type="email" placeholder="Email" autocomplete="username" required><input id="loginPassword" type="password" placeholder="Contraseña" autocomplete="current-password" required><button id="loginButton" class="btn" type="submit">Entrar</button></form><div id="loginMessage" class="login-msg"></div></section>
<div id="app">
<header><div><h1>Job Radar</h1><div class="muted">Oportunidades priorizadas para tu revisión</div></div><div class="session"><span id="sessionEmail" class="muted"></span><button id="logoutButton">Salir</button></div></header>
<div class="stats" id="stats"><div class="stat"><b id="total">–</b>Pendientes</div><div class="stat"><b id="high">–</b>Muy interesantes</div><div class="stat"><b id="interesting">–</b>Interesantes IA</div><div class="stat"><b id="review">–</b>Revisar</div></div>
<div class="filter-panel"><div class="filter-title">VISTA</div><div class="toolbar" id="userFilters"></div><div class="filter-title">ENCAJE IA</div><div class="toolbar" id="aiFilters"></div><div id="resultCount" class="result-count">Mostrando 0 ofertas</div></div>
<main id="list"><div class="empty">Cargando ofertas…</div></main>
</div></div>
<script>
const $=id=>document.getElementById(id);
const SUPABASE_URL='https://auiafqbsgxwfevlbypdf.supabase.co';
const SUPABASE_KEY='sb_publishable_eOXS4XJG4ax9Kg-Qs3PP9A_Rg34TQ25';
let sb=null,data=[],aiActive='ALL',userActive='PENDING',state={},busy={},rejectOpen={};
const aiLabels={ALL:'Todas',HIGH_INTEREST:'🔥 Muy interesante',INTERESTING:'✅ Interesante',REVIEW:'🤔 Revisar',LOW_INTEREST:'⬇ Bajo interés',NO_AI:'⚪ Sin evaluación IA'};
const userLabels={PENDING:'📥 Bandeja de entrada',MY_INTEREST:'❤️ Me interesa',APPLIED:'✓ Aplicadas'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const listHtml=a=>a?.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<span class="muted">Sin observaciones.</span>';
function s(id){return state[id]||(state[id]={interest:null,applied:false,rejection_reason:''})}
function userMatch(j){const u=s(j.id);if(userActive==='PENDING')return (!u.interest&&!u.applied)||u.interest==='no';if(userActive==='MY_INTEREST')return u.interest==='yes';if(userActive==='APPLIED')return u.applied;return true}
function aiMatch(j){if(aiActive==='ALL')return true;if(aiActive==='NO_AI')return !j.decision;return j.decision===aiActive}
function msg(t,type=''){const e=$('loginMessage');e.textContent=t;e.className='login-msg '+type}
async function doLogin(ev){ev.preventDefault();const b=$('loginButton');b.disabled=true;b.textContent='Conectando…';try{const {data:a,error}=await sb.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});if(error)throw error;await showApp(a.session)}catch(e){msg('Error: '+e.message,'error')}finally{b.disabled=false;b.textContent='Entrar'}}
async function doLogout(){await sb.auth.signOut();$('app').style.display='none';$('loginPanel').style.display='block'}
function latestEval(a){return a?.length?[...a].sort((x,y)=>String(y.evaluated_at).localeCompare(String(x.evaluated_at)))[0]:null}
function parseEval(j,e){const w=e?.weaknesses||{},r=e?.reasoning||{};return{id:String(j.id),title:j.title,company:j.companies?.name||'',location:j.location,workplace_type:j.workplace_type,salary:j.salary_text,description:j.description,source:j.job_sources?.[0]?.sources?.name||'',url:j.job_sources?.[0]?.source_url||'',decision:e?.decision||null,score:e?.score||0,reason:r?.short_reason||'',strengths:Array.isArray(e?.strengths)?e.strengths:[],gaps:w?.gaps_or_risks||[],barriers:w?.hard_barriers||[],dimensions:e?{'Responsabilidad y seniority':e.seniority_match,'Project / Program':e.profile_match,'Entorno técnico':e.technical_match,'Liderazgo':e.management_match,'Sector':e.sector_match}:{}}}
function pendingRows(){return data.filter(j=>userMatch(j))}
function updateStats(){const p=pendingRows();$('total').textContent=p.length;$('high').textContent=p.filter(j=>j.decision==='HIGH_INTEREST').length;$('interesting').textContent=p.filter(j=>j.decision==='INTERESTING').length;$('review').textContent=p.filter(j=>j.decision==='REVIEW').length}
async function loadData(){$('list').innerHTML='<div class="empty">Cargando ofertas desde Supabase…</div>';const {data:jobs,error}=await sb.from('jobs').select('id,title,location,workplace_type,description,salary_text,companies(name),job_sources(source_url,sources(name)),ai_evaluations(*)').order('id',{ascending:false});if(error){$('list').innerHTML='<div class="empty">Error: '+esc(error.message)+'</div>';return}const {data:f,error:fe}=await sb.from('user_job_feedback').select('job_id,interest,applied,application_date,rejection_reason');if(fe){$('list').innerHTML='<div class="empty">Error feedback: '+esc(fe.message)+'</div>';return}state={};for(const x of f||[])state[String(x.job_id)]={interest:x.interest==='INTERESTED'?'yes':x.interest==='NOT_INTERESTED'?'no':null,applied:!!x.applied,application_date:x.application_date,rejection_reason:x.rejection_reason||''};data=(jobs||[]).map(j=>parseEval(j,latestEval(j.ai_evaluations)));updateStats();render()}
async function saveFeedback(id,next){busy[id]=true;render();const row={job_id:Number(id),interest:next.interest==='yes'?'INTERESTED':next.interest==='no'?'NOT_INTERESTED':null,applied:!!next.applied,application_date:next.applied?(next.application_date||new Date().toISOString()):null,rejection_reason:next.rejection_reason||null,updated_at:new Date().toISOString()};const {error}=await sb.from('user_job_feedback').upsert(row,{onConflict:'job_id'});busy[id]=false;if(error){alert('No se pudo guardar: '+error.message);await loadData();return false}state[id]={...next,application_date:row.application_date};updateStats();render();return true}
async function recordLearning(id,type,reason=null){const {error}=await sb.rpc('record_learning_signal',{p_job_id:Number(id),p_signal_type:type,p_reason:reason});if(error)console.error('Learning:',error.message)}
async function removeLearning(id,type){const {error}=await sb.from('learning_signals').delete().eq('job_id',Number(id)).eq('signal_type',type);if(error)console.error('Learning delete:',error.message)}
async function setInterest(id,v){if(busy[id])return;const u=s(id);if(v==='no'){rejectOpen[id]=!rejectOpen[id];render();if(rejectOpen[id])setTimeout(()=>{const input=$('reason-'+id);if(input)input.focus()},0);return}rejectOpen[id]=false;const turningOn=u.interest!=='yes';const ok=await saveFeedback(id,{...u,interest:turningOn?'yes':null,rejection_reason:''});if(ok){if(turningOn)await recordLearning(id,'INTERESTED');else await removeLearning(id,'INTERESTED')}}
async function toggleApplied(id){if(busy[id])return;const u=s(id),a=!u.applied;const ok=await saveFeedback(id,{...u,applied:a,application_date:a?new Date().toISOString():null});if(ok){if(a)await recordLearning(id,'APPLIED');else await removeLearning(id,'APPLIED')}}
async function deleteRejected(id){if(busy[id])return;const input=$('reason-'+id),reason=(input?.value||'').trim();busy[id]=true;if(input)input.disabled=true;const btn=$('delete-'+id);if(btn)btn.disabled=true;await recordLearning(id,'REJECTED',reason);const {error}=await sb.rpc('archive_and_delete_job',{p_job_id:Number(id),p_reason:reason});busy[id]=false;if(error){if(input)input.disabled=false;if(btn)btn.disabled=false;await removeLearning(id,'REJECTED');alert('No se pudo eliminar: '+error.message);return}delete state[id];delete rejectOpen[id];data=data.filter(j=>j.id!==String(id));updateStats();render()}
function rejectKeydown(ev,id){if(ev.key==='Enter'){ev.preventDefault();deleteRejected(id)}}
function render(){const rows=data.filter(x=>aiMatch(x)&&userMatch(x));$('stats').style.display=userActive==='PENDING'?'grid':'none';$('resultCount').textContent='Mostrando '+rows.length+(rows.length===1?' oferta':' ofertas');$('list').innerHTML=rows.length?'':'<div class="empty">'+(userActive==='PENDING'?'🎉 No tienes ofertas pendientes de analizar.':'No hay ofertas con estos filtros.')+'</div>';for(const j of rows){const id=esc(j.id),u=s(j.id),dis=busy[j.id]?'disabled':'',dims=Object.entries(j.dimensions||{}).filter(x=>x[1]!=null).map(([k,v])=>`<span class="dim">${esc(k)}: <b>${Math.round(v)}</b></span>`).join(''),badges=(u.interest==='yes'?'<span class="badge userbadge">♥ Me interesa</span>':'')+(u.applied?'<span class="badge userbadge">✓ Aplicada</span>':'');const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="top"><div><span class="badge">${j.decision?(aiLabels[j.decision]||j.decision):'⚪ Sin evaluación IA'}</span>${badges}<div class="title">${esc(j.title||'Sin título')}</div><div class="company">${esc(j.company)}</div><div class="meta">${esc([j.location,j.workplace_type,j.salary,j.source].filter(Boolean).join(' · '))}</div></div><div><div class="score">${j.decision?Math.round(j.score||0):'–'}</div><div class="note">encaje / 100</div></div></div><div class="reason">${esc(j.reason)}</div><div class="quick"><button ${dis} class="${u.interest==='yes'?'selected':''}" onclick="setInterest('${id}','yes')">♥ Me interesa</button><button ${dis} class="danger ${(rejectOpen[j.id]||u.interest==='no')?'selected':''}" onclick="setInterest('${id}','no')">No me interesa</button><button ${dis} class="${u.applied?'selected':''}" onclick="toggleApplied('${id}')">✓ He aplicado</button></div><div class="rejectbox ${(rejectOpen[j.id]||u.interest==='no')?'open':''}" id="reject-${id}"><input id="reason-${id}" value="${esc(u.rejection_reason||'')}" placeholder="¿Por qué no te interesa? (opcional)" onkeydown="rejectKeydown(event,'${id}')"><button id="delete-${id}" class="deletebtn" onclick="deleteRejected('${id}')">Eliminar</button></div><div class="actions"><button class="btn" onclick="document.getElementById('d-${id}').classList.toggle('open')">Ver ficha completa</button>${j.url?`<a class="btn secondary" href="${esc(j.url)}" target="_blank" rel="noopener">Abrir oferta original</a>`:''}</div><div class="detail" id="d-${id}"><h3>Análisis de encaje</h3><div class="dimensions">${dims}</div><h3>Puntos fuertes</h3>${listHtml(j.strengths)}<h3>Riesgos o gaps</h3>${listHtml(j.gaps)}<h3>Barreras</h3>${listHtml(j.barriers)}<h3>Descripción original de la oferta</h3><div class="desc">${esc(j.description||'Descripción no disponible.')}</div></div>`;$('list').appendChild(el)}refreshFilterButtons()}
function refreshFilterButtons(){[...$('userFilters').children].forEach(b=>b.classList.toggle('active',b.dataset.key===userActive));[...$('aiFilters').children].forEach(b=>b.classList.toggle('active',b.dataset.key===aiActive))}
function makeFilters(el,obj,setter,active){el.innerHTML='';for(const k of Object.keys(obj)){const b=document.createElement('button');b.textContent=obj[k];b.dataset.key=k;b.className=k===active?'active':'';b.onclick=()=>{setter(k);updateStats();render()};el.appendChild(b)}}
async function showApp(session){$('loginPanel').style.display='none';$('app').style.display='block';$('sessionEmail').textContent=session.user.email||'';makeFilters($('userFilters'),userLabels,k=>userActive=k,userActive);makeFilters($('aiFilters'),aiLabels,k=>aiActive=k,aiActive);await loadData()}
async function boot(){try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);$('loginForm').addEventListener('submit',doLogin);$('logoutButton').addEventListener('click',doLogout);const {data:{session}}=await sb.auth.getSession();if(session)await showApp(session);else msg('Listo para iniciar sesión.')}catch(e){msg('Error: '+e.message,'error')}}
boot();
</script>
</body>
</html>
