<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Radar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:30px 18px}header{display:flex;justify-content:flex-end;align-items:center;min-height:36px;gap:20px}.muted{color:#687386}.card,.loginbox{background:#fff;border:1px solid #e1e6ef;border-radius:15px}.filter-panel{position:sticky;top:0;z-index:20;background:rgba(244,246,250,.97);backdrop-filter:blur(8px);padding:10px 0 8px;border-bottom:1px solid #e1e6ef}.toolbar,.actions,.quick,.advanced{display:flex;gap:8px;flex-wrap:wrap}.toolbar{margin:7px 0 10px}.toolbar button,.quick button{border:1px solid #d6dce7;background:#fff;padding:9px 13px;border-radius:999px;cursor:pointer}.toolbar button.active,.quick button.selected{background:#172033;color:#fff}.filter-title{font-size:12px;font-weight:700;color:#7b8493;margin-top:7px}.advanced{align-items:flex-start;margin:8px 0}.filter-menu{position:relative}.filter-trigger,.clear{border:1px solid #d6dce7;background:#fff;padding:9px 13px;border-radius:999px;cursor:pointer;font:inherit}.filter-trigger.active{background:#172033;color:#fff}.filter-popover{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:50;min-width:260px;max-width:360px;max-height:300px;overflow:auto;background:#fff;border:1px solid #d6dce7;border-radius:12px;padding:8px;box-shadow:0 10px 28px rgba(23,32,51,.14)}.filter-menu.open .filter-popover{display:block}.filter-option{display:flex;align-items:flex-start;gap:9px;padding:8px;border-radius:8px;cursor:pointer}.filter-option:hover{background:#f4f6fa}.filter-option input{margin-top:3px}.filter-option span{line-height:1.25}.clear{white-space:nowrap}.result-count{font-size:14px;font-weight:700;margin:7px 0 2px}.selection-bar{display:flex;align-items:center;gap:8px;margin:8px 0 2px;font-size:14px}.selection-bar label{display:flex;align-items:center;gap:7px;cursor:pointer}.bulk-actions{display:flex;gap:8px;flex-wrap:wrap;margin-left:8px}.bulk-actions button{border:1px solid #d6dce7;background:#fff;padding:7px 11px;border-radius:999px;cursor:pointer}.bulk-actions button:disabled{opacity:.45;cursor:not-allowed}.bulk-actions .danger{border-color:#e2b8b8}.bulk-reject{display:none;align-items:center;gap:8px;flex:1;min-width:320px}.bulk-reject.open{display:flex}.bulk-reject input{min-width:240px;flex:1;padding:7px 10px;border:1px solid #d8c6c6;border-radius:8px}.bulk-reject .deletebtn{padding:7px 11px;background:#8d3030;color:#fff!important}.job-select{margin-right:9px;transform:scale(1.1)}.card{padding:21px;margin:13px 0}.top{display:flex;justify-content:space-between;gap:20px}.score{font-size:29px;font-weight:800}.badge{display:inline-block;font-size:12px;font-weight:750;padding:5px 9px;border-radius:999px;background:#edf1f6}.userbadge{margin-left:5px;background:#e9f5ed}.title{font-size:20px;font-weight:750;margin:6px 0}.company{font-weight:650}.meta,.reason{color:#5f697a;margin-top:8px}.reason{line-height:1.5}.quick{margin-top:14px;padding:11px 0;border-top:1px solid #edf0f4;border-bottom:1px solid #edf0f4}.quick button:disabled{opacity:.55}.quick .danger{border-color:#e2b8b8}.rejectbox{display:none;margin:12px 0 4px;padding:13px;background:#fff7f7;border:1px solid #ead2d2;border-radius:10px}.rejectbox.open{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.rejectbox input{flex:1;min-width:240px;padding:10px 12px;border:1px solid #d8c6c6;border-radius:8px;font:inherit}.deletebtn{border:0;background:#8d3030;color:#fff;padding:10px 14px;border-radius:8px;cursor:pointer}.actions{margin-top:14px}.btn{border:0;background:#172033;color:#fff;padding:10px 13px;border-radius:8px;text-decoration:none;cursor:pointer}.btn.secondary{background:#eef1f6;color:#172033}.detail{display:none;border-top:1px solid #e5e9f0;margin-top:18px;padding-top:18px}.detail.open{display:block}.detail h3{font-size:15px;margin:18px 0 7px}.desc{white-space:pre-wrap;max-height:420px;overflow:auto;background:#f7f8fb;padding:15px;border-radius:10px}.dimensions{display:flex;gap:7px;flex-wrap:wrap}.dim{background:#f2f4f8;border-radius:8px;padding:7px 9px;font-size:13px}.note{font-size:12px;color:#7b8493;margin-top:6px}.empty{text-align:center;padding:50px;color:#687386}.loginbox{max-width:430px;margin:70px auto;padding:28px}.loginbox input{width:100%;padding:12px;margin:7px 0;border:1px solid #d6dce7;border-radius:9px;font:inherit}.loginbox button{width:100%;margin-top:10px}.session{display:flex;align-items:center;gap:10px}.session button{border:0;background:none;cursor:pointer;color:#687386}#app{display:none}@media(max-width:700px){header,.top{display:block}.session{justify-content:flex-end}.score{margin-top:10px}.field{min-width:100%}.filter-panel{position:relative}}
</style></head><body><div class="wrap">
<section id="loginPanel" class="loginbox"><h2>Job Radar</h2><p class="muted">Accede a tu radar laboral.</p><form id="loginForm"><input id="loginEmail" type="email" placeholder="Email" required><input id="loginPassword" type="password" placeholder="Contraseña" required><button id="loginButton" class="btn">Entrar</button></form><div id="loginMessage"></div></section>
<div id="app"><header><div class="session"><span id="sessionEmail" class="muted"></span><button id="logoutButton">Salir</button></div></header>
<div class="filter-panel"><div class="filter-title">VISTA</div><div class="toolbar" id="userFilters"></div><div class="filter-title">ENCAJE IA</div><div class="toolbar" id="aiFilters"></div><div class="advanced"><div class="filter-menu" id="locationMenu"><button class="filter-trigger" type="button" data-menu="locationMenu">Ubicación</button><div class="filter-popover" id="locationOptions"></div></div><div class="filter-menu" id="workplaceMenu"><button class="filter-trigger" type="button" data-menu="workplaceMenu">Tipo de trabajo</button><div class="filter-popover" id="workplaceOptions"></div></div><div class="filter-menu" id="salaryMenu"><button class="filter-trigger" type="button" data-menu="salaryMenu">Sueldo</button><div class="filter-popover" id="salaryOptions"></div></div><button class="clear" id="clearAdvanced" type="button">Limpiar</button></div><div id="resultCount" class="result-count">Mostrando 0 ofertas</div><div class="selection-bar"><label><input id="selectAllVisible" type="checkbox"> Seleccionar todas las visibles</label><span id="selectedCount" class="muted">0 seleccionadas</span><div class="bulk-actions"><button id="bulkInterested" type="button" disabled>♥ Me interesa</button><button id="bulkNotInterested" class="danger" type="button" disabled>No me interesa</button><div id="bulkRejectBox" class="bulk-reject"><input id="bulkRejectReason" placeholder="Comentario (opcional)"><button id="bulkDelete" class="deletebtn" type="button">Eliminar seleccionadas</button></div></div></div></div>
<main id="list"><div class="empty">Cargando ofertas…</div></main></div></div>
<script>
const $=id=>document.getElementById(id),SUPABASE_URL='https://auiafqbsgxwfevlbypdf.supabase.co',SUPABASE_KEY='sb_publishable_eOXS4XJG4ax9Kg-Qs3PP9A_Rg34TQ25';
let sb=null,data=[],aiActive='ALL',userActive='PENDING',state={},busy={},rejectOpen={},selectedJobs=new Set();
const aiLabels={ALL:'Todas',HIGH_INTEREST:'🔥 Muy interesante',INTERESTING:'✅ Interesante',REVIEW:'🤔 Revisar',LOW_INTEREST:'⬇ Bajo interés',NO_AI:'⚪ Sin evaluación IA'},userLabels={PENDING:'📥 Bandeja de entrada',MY_INTEREST:'❤️ Me interesa',APPLIED:'✓ Aplicadas'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const listHtml=a=>a?.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<span class="muted">Sin observaciones.</span>';
function s(id){return state[id]||(state[id]={interest:null,applied:false,rejection_reason:''})}
function userMatch(j){const u=s(j.id);if(userActive==='PENDING')return (!u.interest&&!u.applied)||u.interest==='no';if(userActive==='MY_INTEREST')return u.interest==='yes';if(userActive==='APPLIED')return u.applied;return true}
function aiMatch(j){if(aiActive==='ALL')return true;if(aiActive==='NO_AI')return !j.decision;return j.decision===aiActive}
function checked(name){return [...document.querySelectorAll(`input[name="${name}"]:checked`)].map(x=>x.value)}
function normWork(v){const x=String(v||'').toLowerCase();if(/remote|remot/.test(x))return 'Remoto';if(/hybrid|h[ií]brid/.test(x))return 'Híbrido';if(/on.?site|presencial/.test(x))return 'Presencial';return 'Sin especificar'}
function salaryMin(v){if(!v)return null;let x=String(v).toLowerCase().replace(/\s/g,'');let nums=[...x.matchAll(/(\d+(?:[.,]\d+)?)\s*(k|000)?/g)].map(m=>{let n=parseFloat(m[1].replace(',','.'));if(m[2]==='k'||(n<1000&&/k/.test(x)))n*=1000;return n}).filter(n=>n>=10000);return nums.length?Math.min(...nums):null}
function advancedMatch(j){const loc=checked('locationFilter'),work=checked('workplaceFilter'),sal=checked('salaryFilter');if(loc.length&&!loc.includes(j.location||'Sin especificar'))return false;if(work.length&&!work.includes(normWork(j.workplace_type)))return false;if(sal.length){const n=salaryMin(j.salary),ok=sal.some(v=>{if(v==='NONE')return n===null;if(n===null)return false;const [lo,hi]=v.split('-').map(Number);return n>=lo&&(hi===0||n<hi)});if(!ok)return false}return true}
function latestEval(a){return a?.length?[...a].sort((x,y)=>String(y.evaluated_at).localeCompare(String(x.evaluated_at)))[0]:null}
function parseEval(j,e){const w=e?.weaknesses||{},r=e?.reasoning||{};return{id:String(j.id),title:j.title,company:j.companies?.name||'',location:j.location||'Sin especificar',workplace_type:j.workplace_type,salary:j.salary_text,description:j.description,source:j.job_sources?.[0]?.sources?.name||'',url:j.job_sources?.[0]?.source_url||'',decision:e?.decision||null,score:e?.score||0,reason:r?.short_reason||'',strengths:Array.isArray(e?.strengths)?e.strengths:[],gaps:w?.gaps_or_risks||[],barriers:w?.hard_barriers||[],dimensions:e?{'Responsabilidad y seniority':e.seniority_match,'Project / Program':e.profile_match,'Entorno técnico':e.technical_match,'Liderazgo':e.management_match,'Sector':e.sector_match}:{}}}
function msg(t,type=''){const e=$('loginMessage');e.textContent=t;e.className=type}
async function doLogin(ev){ev.preventDefault();const b=$('loginButton');b.disabled=true;try{const {data:a,error}=await sb.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});if(error)throw error;await showApp(a.session)}catch(e){msg('Error: '+e.message,'error')}finally{b.disabled=false}}
async function doLogout(){await sb.auth.signOut();$('app').style.display='none';$('loginPanel').style.display='block'}
function optionHtml(name,value,label){return `<label class="filter-option"><input type="checkbox" name="${name}" value="${esc(value)}"><span>${esc(label)}</span></label>`}function allOptionHtml(name){return `<label class="filter-option"><input type="checkbox" data-all-for="${name}" checked><span>Todas</span></label>`}function buildAdvanced(){const locs=[...new Set(data.map(j=>j.location||'Sin especificar'))].sort((a,b)=>a.localeCompare(b,'es'));$('locationOptions').innerHTML=allOptionHtml('locationFilter')+locs.map(x=>optionHtml('locationFilter',x,x)).join('');const works=['Presencial','Híbrido','Remoto','Sin especificar'];$('workplaceOptions').innerHTML=allOptionHtml('workplaceFilter')+works.map(x=>optionHtml('workplaceFilter',x,x)).join('');const salaries=[['NONE','Sin especificar'],['0-40000','< 40k'],['40000-50000','40–50k'],['50000-60000','50–60k'],['60000-70000','60–70k'],['70000-80000','70–80k'],['80000-100000','80–100k'],['100000-0','> 100k']];$('salaryOptions').innerHTML=allOptionHtml('salaryFilter')+salaries.map(([v,l])=>optionHtml('salaryFilter',v,l)).join('');document.querySelectorAll('.filter-popover input[name]').forEach(x=>x.addEventListener('change',()=>{const all=document.querySelector(`[data-all-for="${x.name}"]`);if(all)all.checked=checked(x.name).length===0;refreshAdvancedButtons();render()}));document.querySelectorAll('.filter-popover input[data-all-for]').forEach(x=>x.addEventListener('change',()=>{if(x.checked){document.querySelectorAll(`input[name="${x.dataset.allFor}"]:checked`).forEach(y=>y.checked=false)}else if(checked(x.dataset.allFor).length===0)x.checked=true;refreshAdvancedButtons();render()}));refreshAdvancedButtons()}function refreshAdvancedButtons(){[['locationMenu','locationFilter'],['workplaceMenu','workplaceFilter'],['salaryMenu','salaryFilter']].forEach(([menu,name])=>$(menu).querySelector('.filter-trigger').classList.toggle('active',checked(name).length>0))}function toggleMenu(id){document.querySelectorAll('.filter-menu').forEach(m=>m.classList.toggle('open',m.id===id?!m.classList.contains('open'):false))}
async function loadData(){$('list').innerHTML='<div class="empty">Cargando ofertas desde Supabase…</div>';const {data:jobs,error}=await sb.from('jobs').select('id,title,location,workplace_type,description,salary_text,companies(name),job_sources(source_url,sources(name)),ai_evaluations(*)').order('id',{ascending:false});if(error){$('list').innerHTML='<div class="empty">Error: '+esc(error.message)+'</div>';return}const {data:f,error:fe}=await sb.from('user_job_feedback').select('job_id,interest,applied,application_date,rejection_reason');if(fe){$('list').innerHTML='<div class="empty">Error feedback: '+esc(fe.message)+'</div>';return}state={};for(const x of f||[])state[String(x.job_id)]={interest:x.interest==='INTERESTED'?'yes':x.interest==='NOT_INTERESTED'?'no':null,applied:!!x.applied,application_date:x.application_date,rejection_reason:x.rejection_reason||''};data=(jobs||[]).map(j=>parseEval(j,latestEval(j.ai_evaluations)));buildAdvanced();render()}
async function saveFeedback(id,next){busy[id]=true;render();const row={job_id:Number(id),interest:next.interest==='yes'?'INTERESTED':next.interest==='no'?'NOT_INTERESTED':null,applied:!!next.applied,application_date:next.applied?(next.application_date||new Date().toISOString()):null,rejection_reason:next.rejection_reason||null,updated_at:new Date().toISOString()};const {error}=await sb.from('user_job_feedback').upsert(row,{onConflict:'job_id'});busy[id]=false;if(error){alert('No se pudo guardar: '+error.message);await loadData();return false}state[id]={...next,application_date:row.application_date};render();return true}
async function recordLearning(id,type,reason=null){const {error}=await sb.rpc('record_learning_signal',{p_job_id:Number(id),p_signal_type:type,p_reason:reason});if(error)console.error(error)}
async function removeLearning(id,type){await sb.from('learning_signals').delete().eq('job_id',Number(id)).eq('signal_type',type)}
async function setInterest(id,v){if(busy[id])return;const u=s(id);if(v==='no'){rejectOpen[id]=!rejectOpen[id];render();return}rejectOpen[id]=false;const on=u.interest!=='yes';const ok=await saveFeedback(id,{...u,interest:on?'yes':null,rejection_reason:''});if(ok){if(on)await recordLearning(id,'INTERESTED');else await removeLearning(id,'INTERESTED')}}
async function toggleApplied(id){if(busy[id])return;const u=s(id),a=!u.applied;const ok=await saveFeedback(id,{...u,applied:a,application_date:a?new Date().toISOString():null});if(ok){if(a)await recordLearning(id,'APPLIED');else await removeLearning(id,'APPLIED')}}
async function bulkSetInterest(value){const ids=[...selectedJobs];if(!ids.length)return;if(value==='no'){$('bulkRejectBox').classList.add('open');return}ids.forEach(id=>busy[id]=true);render();let failed=0;for(const id of ids){const u=s(id),row={job_id:Number(id),interest:'INTERESTED',applied:!!u.applied,application_date:u.application_date||null,rejection_reason:null,updated_at:new Date().toISOString()};const {error}=await sb.from('user_job_feedback').upsert(row,{onConflict:'job_id'});if(error){failed++;busy[id]=false;continue}state[id]={...u,interest:'yes',rejection_reason:''};await recordLearning(id,'INTERESTED');busy[id]=false}selectedJobs.clear();if(failed)alert('No se pudieron actualizar '+failed+' ofertas.');render()}
async function bulkDeleteRejected(){const ids=[...selectedJobs];if(!ids.length)return;const reason=$('bulkRejectReason').value.trim();ids.forEach(id=>busy[id]=true);render();let failed=0;for(const id of ids){const u=s(id);const row={job_id:Number(id),interest:'NOT_INTERESTED',applied:!!u.applied,application_date:u.application_date||null,rejection_reason:reason||null,updated_at:new Date().toISOString()};const {error}=await sb.from('user_job_feedback').upsert(row,{onConflict:'job_id'});busy[id]=false;if(error){failed++;continue}state[id]={...u,interest:'no',rejection_reason:reason};await recordLearning(id,'REJECTED',reason||null);selectedJobs.delete(String(id))}$('bulkRejectReason').value='';$('bulkRejectBox').classList.remove('open');if(failed)alert('No se pudieron actualizar '+failed+' ofertas.');render()}
async function deleteRejected(id){if(busy[id])return;const input=$('reason-'+id),reason=(input?.value||'').trim();busy[id]=true;await recordLearning(id,'REJECTED',reason);const {error}=await sb.rpc('archive_and_delete_job',{p_job_id:Number(id),p_reason:reason});busy[id]=false;if(error){await removeLearning(id,'REJECTED');alert('No se pudo eliminar: '+error.message);return}delete state[id];delete rejectOpen[id];data=data.filter(j=>j.id!==String(id));buildAdvanced();render()}
function rejectKeydown(ev,id){if(ev.key==='Enter'){ev.preventDefault();deleteRejected(id)}}
function toggleJobSelection(id,on){if(on)selectedJobs.add(String(id));else selectedJobs.delete(String(id));render()}function toggleAllVisible(on){const rows=data.filter(x=>aiMatch(x)&&userMatch(x)&&advancedMatch(x));rows.forEach(j=>on?selectedJobs.add(String(j.id)):selectedJobs.delete(String(j.id)));render()}function render(){const rows=data.filter(x=>aiMatch(x)&&userMatch(x)&&advancedMatch(x));$('resultCount').textContent='Mostrando '+rows.length+(rows.length===1?' oferta':' ofertas')+' de '+data.length;$('list').innerHTML=rows.length?'':'<div class="empty">No hay ofertas con estos filtros.</div>';for(const j of rows){const id=esc(j.id),u=s(j.id),dis=busy[j.id]?'disabled':'',dims=Object.entries(j.dimensions||{}).filter(x=>x[1]!=null).map(([k,v])=>`<span class="dim">${esc(k)}: <b>${Math.round(v)}</b></span>`).join(''),badges=(u.interest==='yes'?'<span class="badge userbadge">♥ Me interesa</span>':'')+(u.applied?'<span class="badge userbadge">✓ Aplicada</span>':'');const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="top"><div><label><input class="job-select" type="checkbox" ${selectedJobs.has(String(j.id))?'checked':''} onchange="toggleJobSelection('${id}',this.checked)"></label><span class="badge">${j.decision?(aiLabels[j.decision]||j.decision):'⚪ Sin evaluación IA'}</span>${badges}<div class="title">${esc(j.title||'Sin título')}</div><div class="company">${esc(j.company)}</div><div class="meta">${esc([j.location,normWork(j.workplace_type),j.salary||'Sueldo sin especificar',j.source].filter(Boolean).join(' · '))}</div></div><div><div class="score">${j.decision?Math.round(j.score||0)+'%':'–'}</div><div class="note">encaje IA</div></div></div><div class="reason">${esc(j.reason)}</div><div class="quick"><button ${dis} class="${u.interest==='yes'?'selected':''}" onclick="setInterest('${id}','yes')">♥ Me interesa</button><button ${dis} class="danger ${(rejectOpen[j.id]||u.interest==='no')?'selected':''}" onclick="setInterest('${id}','no')">No me interesa</button><button ${dis} class="${u.applied?'selected':''}" onclick="toggleApplied('${id}')">✓ He aplicado</button></div><div class="rejectbox ${(rejectOpen[j.id]||u.interest==='no')?'open':''}"><input id="reason-${id}" value="${esc(u.rejection_reason||'')}" placeholder="¿Por qué no te interesa? (opcional)" onkeydown="rejectKeydown(event,'${id}')"><button class="deletebtn" onclick="deleteRejected('${id}')">Eliminar</button></div><div class="actions"><button class="btn" onclick="document.getElementById('d-${id}').classList.toggle('open')">Ver ficha completa</button>${j.url?`<a class="btn secondary" href="${esc(j.url)}" target="_blank" rel="noopener">Abrir oferta original</a>`:''}</div><div class="detail" id="d-${id}"><h3>Análisis de encaje</h3><div class="dimensions">${dims}</div><h3>Puntos fuertes</h3>${listHtml(j.strengths)}<h3>Riesgos o gaps</h3>${listHtml(j.gaps)}<h3>Barreras</h3>${listHtml(j.barriers)}<h3>Descripción original de la oferta</h3><div class="desc">${esc(j.description||'Descripción no disponible.')}</div></div>`;$('list').appendChild(el)}const all=$('selectAllVisible');if(all){const n=rows.filter(j=>selectedJobs.has(String(j.id))).length;all.checked=rows.length>0&&n===rows.length;all.indeterminate=n>0&&n<rows.length;$('selectedCount').textContent=selectedJobs.size+' seleccionada'+(selectedJobs.size===1?'':'s');$('bulkInterested').disabled=selectedJobs.size===0;$('bulkNotInterested').disabled=selectedJobs.size===0}refreshFilterButtons()}
function refreshFilterButtons(){[...$('userFilters').children].forEach(b=>b.classList.toggle('active',b.dataset.key===userActive));[...$('aiFilters').children].forEach(b=>b.classList.toggle('active',b.dataset.key===aiActive))}
function makeFilters(el,obj,setter,active){el.innerHTML='';for(const k of Object.keys(obj)){const b=document.createElement('button');b.textContent=obj[k];b.dataset.key=k;b.className=k===active?'active':'';b.onclick=()=>{setter(k);render()};el.appendChild(b)}}
async function showApp(session){$('loginPanel').style.display='none';$('app').style.display='block';$('sessionEmail').textContent=session.user.email||'';makeFilters($('userFilters'),userLabels,k=>userActive=k,userActive);makeFilters($('aiFilters'),aiLabels,k=>aiActive=k,aiActive);await loadData()}
async function boot(){try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);$('loginForm').addEventListener('submit',doLogin);$('logoutButton').addEventListener('click',doLogout);document.querySelectorAll('.filter-trigger').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();toggleMenu(b.dataset.menu)}));document.addEventListener('click',e=>{if(!e.target.closest('.filter-menu'))document.querySelectorAll('.filter-menu').forEach(m=>m.classList.remove('open'))});$('selectAllVisible').addEventListener('change',e=>toggleAllVisible(e.target.checked));$('bulkInterested').addEventListener('click',()=>bulkSetInterest('yes'));$('bulkNotInterested').addEventListener('click',()=>bulkSetInterest('no'));$('bulkDelete').addEventListener('click',bulkDeleteRejected);$('clearAdvanced').onclick=()=>{document.querySelectorAll('.filter-popover input[name]:checked').forEach(x=>x.checked=false);document.querySelectorAll('.filter-popover input[data-all-for]').forEach(x=>x.checked=true);refreshAdvancedButtons();render()};const {data:{session}}=await sb.auth.getSession();if(session)await showApp(session);else msg('Listo para iniciar sesión.')}catch(e){msg('Error: '+e.message,'error')}}boot();
</script><script src="./apply-learning.js"></script></body></html>
