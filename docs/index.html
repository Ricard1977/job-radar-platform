<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Radar</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:30px 18px}header{display:flex;justify-content:space-between;align-items:end;gap:20px}h1{margin:0;font-size:30px}.muted{color:#687386}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat,.card{background:#fff;border:1px solid #e1e6ef;border-radius:15px}.stat{padding:16px}.stat b{display:block;font-size:26px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.toolbar button,.feedback button{border:1px solid #d6dce7;background:#fff;padding:9px 13px;border-radius:999px;cursor:pointer}.toolbar button.active{background:#172033;color:#fff}.card{padding:21px;margin:13px 0}.top{display:flex;justify-content:space-between;gap:20px}.score{font-size:29px;font-weight:800}.badge{display:inline-block;font-size:12px;font-weight:750;padding:5px 9px;border-radius:999px;background:#edf1f6}.title{font-size:20px;font-weight:750;margin:6px 0}.company{font-weight:650}.meta,.reason{color:#5f697a;margin-top:8px}.reason{line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.btn{border:0;background:#172033;color:#fff;padding:9px 13px;border-radius:8px;text-decoration:none;cursor:pointer}.btn.secondary{background:#eef1f6;color:#172033}.detail{display:none;border-top:1px solid #e5e9f0;margin-top:18px;padding-top:18px}.detail.open{display:block}.detail h3{font-size:15px;margin:18px 0 7px}.detail p,.detail li{line-height:1.55}.desc{white-space:pre-wrap;max-height:420px;overflow:auto;background:#f7f8fb;padding:15px;border-radius:10px}.dimensions{display:flex;gap:7px;flex-wrap:wrap}.dim{background:#f2f4f8;border-radius:8px;padding:7px 9px;font-size:13px}.feedback{margin-top:18px;padding:14px;background:#fafbfc;border-radius:10px}.feedback .selected{background:#172033;color:#fff}.note{font-size:12px;color:#7b8493;margin-top:6px}.empty{text-align:center;padding:50px;color:#687386}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}header,.top{display:block}.score{margin-top:10px}}</style></head><body><div class="wrap"><header><div><h1>Job Radar</h1><div class="muted">Oportunidades priorizadas para tu revisión</div></div><div id="updated" class="muted"></div></header><div class="stats"><div class="stat"><b id="total">–</b>Analizadas</div><div class="stat"><b id="high">–</b>Muy interesantes</div><div class="stat"><b id="interesting">–</b>Interesantes</div><div class="stat"><b id="review">–</b>Revisar</div></div><div class="toolbar" id="filters"></div><main id="list"><div class="empty">Cargando ofertas…</div></main></div><script>
const labels={ALL:'Todas',HIGH_INTEREST:'🔥 Muy interesante',INTERESTING:'✅ Interesante',REVIEW:'🤔 Revisar',LOW_INTEREST:'⬇ Bajo interés'};let data=[],active='ALL';const feedback=JSON.parse(localStorage.getItem('jobRadarFeedback')||'{}');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const listHtml=a=>a?.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<span class="muted">Sin observaciones.</span>';
function render(){const list=document.querySelector('#list'),rows=active==='ALL'?data:data.filter(x=>x.decision===active);list.innerHTML=rows.length?'':'<div class="empty">No hay ofertas en esta categoría.</div>';for(const j of rows){const id=esc(j.id),dims=Object.entries(j.dimensions||{}).filter(x=>x[1]!=null).map(([k,v])=>`<span class="dim">${esc(k)}: <b>${Math.round(v)}</b></span>`).join('');const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="top"><div><span class="badge">${labels[j.decision]||'Sin clasificar'}</span><div class="title">${esc(j.title||'Sin título')}</div><div class="company">${esc(j.company||'')}</div><div class="meta">${esc([j.location,j.workplace_type,j.salary,j.source].filter(Boolean).join(' · '))}</div></div><div><div class="score">${Math.round(j.score||0)}</div><div class="note">encaje / 100</div></div></div><div class="reason">${esc(j.reason||'')}</div><div class="actions"><button class="btn" onclick="toggle('${id}')">Ver ficha completa</button>${j.url?`<a class="btn secondary" href="${esc(j.url)}" target="_blank" rel="noopener">Abrir oferta original</a>`:''}</div><div class="detail" id="d-${id}"><h3>Resumen en castellano</h3><p>${esc(j.spanish_summary||'Esta oferta todavía no dispone de resumen en castellano; se generará en la próxima evaluación.')}</p><h3>Análisis de encaje</h3><div class="dimensions">${dims}</div><h3>Puntos fuertes</h3>${listHtml(j.strengths)}<h3>Riesgos o gaps</h3>${listHtml(j.gaps)}<h3>Barreras</h3>${listHtml(j.barriers)}<h3>Descripción original de la oferta</h3><div class="desc">${esc(j.description||'Descripción no disponible.')}</div><div class="feedback"><b>Tu valoración</b><div class="note">Esta primera versión guarda tu feedback en este navegador. La sincronización con la BBDD será el siguiente incremento.</div><div class="actions">${[['yes','👍 Me interesa'],['maybe','🤔 Dudosa'],['no','👎 No me interesa']].map(([v,t])=>`<button data-fb="${id}-${v}" class="${feedback[j.id]===v?'selected':''}" onclick="setFeedback('${id}','${v}')">${t}</button>`).join('')}</div></div></div>`;list.appendChild(el)}}
function toggle(id){document.querySelector('#d-'+id)?.classList.toggle('open')}function setFeedback(id,v){feedback[id]=v;localStorage.setItem('jobRadarFeedback',JSON.stringify(feedback));render();document.querySelector('#d-'+id)?.classList.add('open')}
fetch('data/jobs.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{data=x.jobs||[];total.textContent=data.length;high.textContent=data.filter(j=>j.decision==='HIGH_INTEREST').length;interesting.textContent=data.filter(j=>j.decision==='INTERESTING').length;review.textContent=data.filter(j=>j.decision==='REVIEW').length;updated.textContent='Actualizado: '+new Date(x.generated_at).toLocaleString('es-ES');const f=document.querySelector('#filters');for(const k of Object.keys(labels)){const b=document.createElement('button');b.textContent=labels[k];b.className=k==='ALL'?'active':'';b.onclick=()=>{active=k;[...f.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');render()};f.appendChild(b)}render()}).catch(()=>list.innerHTML='<div class="empty">No se pudo cargar el dashboard.</div>');
</script></body></html>
