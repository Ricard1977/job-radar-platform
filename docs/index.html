<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Radar</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:30px 18px}header{display:flex;justify-content:space-between;align-items:end;gap:20px}h1{margin:0;font-size:30px}.muted{color:#687386}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat,.card,.loginbox{background:#fff;border:1px solid #e1e6ef;border-radius:15px}.stat{padding:16px}.stat b{display:block;font-size:26px}.toolbar,.actions,.quick{display:flex;gap:8px;flex-wrap:wrap}.toolbar{margin:10px 0 18px}.toolbar button,.quick button{border:1px solid #d6dce7;background:#fff;padding:9px 13px;border-radius:999px;cursor:pointer}.toolbar button.active,.quick button.selected{background:#172033;color:#fff}.quick button:disabled{opacity:.55;cursor:wait}.filter-title{font-size:12px;font-weight:700;color:#7b8493;margin-top:16px}.card{padding:21px;margin:13px 0}.top{display:flex;justify-content:space-between;gap:20px}.score{font-size:29px;font-weight:800}.badge{display:inline-block;font-size:12px;font-weight:750;padding:5px 9px;border-radius:999px;background:#edf1f6}.userbadge{margin-left:5px;background:#e9f5ed}.title{font-size:20px;font-weight:750;margin:6px 0}.company{font-weight:650}.meta,.reason{color:#5f697a;margin-top:8px}.reason{line-height:1.5}.quick{margin-top:14px;padding:11px 0;border-top:1px solid #edf0f4;border-bottom:1px solid #edf0f4}.quick .danger{border-color:#e2b8b8}.rejectbox{display:none;margin:12px 0 4px;padding:13px;background:#fff7f7;border:1px solid #ead2d2;border-radius:10px}.rejectbox.open{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.rejectbox input{flex:1;min-width:240px;padding:10px 12px;border:1px solid #d8c6c6;border-radius:8px;font:inherit}.deletebtn{border:0;background:#8d3030;color:#fff;padding:10px 14px;border-radius:8px;cursor:pointer}.actions{margin-top:14px}.btn{border:0;background:#172033;color:#fff;padding:10px 13px;border-radius:8px;text-decoration:none;cursor:pointer}.btn.secondary{background:#eef1f6;color:#172033}.detail{display:none;border-top:1px solid #e5e9f0;margin-top:18px;padding-top:18px}.detail.open{display:block}.detail h3{font-size:15px;margin:18px 0 7px}.desc{white-space:pre-wrap;max-height:420px;overflow:auto;background:#f7f8fb;padding:15px;border-radius:10px}.dimensions{display:flex;gap:7px;flex-wrap:wrap}.dim{background:#f2f4f8;border-radius:8px;padding:7px 9px;font-size:13px}.note{font-size:12px;color:#7b8493;margin-top:6px}.empty{text-align:center;padding:50px;color:#687386}.loginbox{max-width:430px;margin:70px auto;padding:28px}.loginbox input{width:100%;padding:12px;margin:7px 0;border:1px solid #d6dce7;border-radius:9px;font:inherit}.loginbox button{width:100%;margin-top:10px}.login-msg{margin-top:11px;font-size:13px;min-height:18px}.error{color:#a02b2b}.session{display:flex;align-items:center;gap:10px}.session button{border:0;background:none;cursor:pointer;color:#687386}#app{display:none}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}header,.top{display:block}.rejectbox.open{display:block}.rejectbox input,.deletebtn{width:100%;margin-top:6px}}</style></head><body><div class="wrap"><section id="loginPanel" class="loginbox"><h2>Job Radar</h2><p class="muted">Accede a tu radar laboral.</p><form id="loginForm"><input id="loginEmail" type="email" placeholder="Email" required><input id="loginPassword" type="password" placeholder="Contraseña" required><button id="loginButton" class="btn" type="submit">Entrar</button></form><div id="loginMessage" class="login-msg"></div></section><div id="app"><header><div><h1>Job Radar</h1><div class="muted">Bandeja de oportunidades para revisar</div></div><div class="session"><span id="sessionEmail" class="muted"></span><button id="logoutButton">Salir</button></div></header><div class="stats"><div class="stat"><b id="pendingCount">–</b>Por analizar</div><div class="stat"><b id="likedCount">–</b>Me interesan</div><div class="stat"><b id="appliedCount">–</b>Aplicadas</div><div class="stat"><b id="total">–</b>Activas</div></div><div class="filter-title">VISTA</div><div class="toolbar" id="userFilters"></div><div class="filter-title">ENCAJE IA</div><div class="toolbar" id="aiFilters"></div><main id="list"></main></div></div><script>
const $=id=>document.getElementById(id),URL='https://auiafqbsgxwfevlbypdf.supabase.co',KEY='sb_publishable_eOXS4XJG4ax9Kg-Qs3PP9A_Rg34TQ25';let sb,data=[],view='PENDING',ai='ALL',state={},busy={},rejectOpen={};const views={PENDING:'📥 Por analizar',LIKED:'❤️ Me interesa',APPLIED:'✓ Aplicadas'},ais={ALL:'Todas',HIGH_INTEREST:'🔥 Muy interesante',INTERESTING:'✅ Interesante',REVIEW:'🤔 Revisar',LOW_INTEREST:'⬇ Bajo interés'};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function s(id){return state[id]||(state[id]={interest:null,applied:false})}function match(j){const u=s(j.id);if(view==='PENDING')return !u.interest&&!u.applied;if(view==='LIKED')return u.interest==='yes';if(view==='APPLIED')return u.applied;return true}function counts(){$('pendingCount').textContent=data.filter(j=>{const u=s(j.id);return !u.interest&&!u.applied}).length;$('likedCount').textContent=data.filter(j=>s(j.id).interest==='yes').length;$('appliedCount').textContent=data.filter(j=>s(j.id).applied).length;$('total').textContent=data.length}function filters(el,obj,setter,active){el.innerHTML='';for(const k in obj){const b=document.createElement('button');b.textContent=obj[k]+' '+(k==='PENDING'?'('+data.filter(j=>{const u=s(j.id);return !u.interest&&!u.applied}).length+')':k==='LIKED'?'('+data.filter(j=>s(j.id).interest==='yes').length+')':k==='APPLIED'?'('+data.filter(j=>s(j.id).applied).length+')':'');b.className=k===active?'active':'';b.onclick=()=>{setter(k);render()};el.appendChild(b)}}function latest(a){return a?.length?[...a].sort((x,y)=>String(y.evaluated_at).localeCompare(String(x.evaluated_at)))[0]:null}function parse(j,e){const w=e?.weaknesses||{},r=e?.reasoning||{};return{id:String(j.id),title:j.title,company:j.companies?.name||'',location:j.location,description:j.description,url:j.job_sources?.[0]?.source_url||'',decision:e?.decision||null,score:e?.score||0,reason:r?.short_reason||'',strengths:Array.isArray(e?.strengths)?e.strengths:[],gaps:w?.gaps_or_risks||[]}}async function load(){const {data:jobs,error}=await sb.from('jobs').select('id,title,location,description,companies(name),job_sources(source_url),ai_evaluations(*)').order('id',{ascending:false});if(error){$('list').textContent=error.message;return}const {data:f,error:fe}=await sb.from('user_job_feedback').select('job_id,interest,applied,application_date,rejection_reason');if(fe){$('list').textContent=fe.message;return}state={};for(const x of f||[])state[String(x.job_id)]={interest:x.interest==='INTERESTED'?'yes':x.interest==='NOT_INTERESTED'?'no':null,applied:!!x.applied,application_date:x.application_date,rejection_reason:x.rejection_reason||''};data=(jobs||[]).map(j=>parse(j,latest(j.ai_evaluations)));render()}async function save(id,next){busy[id]=true;const row={job_id:Number(id),interest:next.interest==='yes'?'INTERESTED':next.interest==='no'?'NOT_INTERESTED':null,applied:!!next.applied,application_date:next.applied?(next.application_date||new Date().toISOString()):null,rejection_reason:next.rejection_reason||null,updated_at:new Date().toISOString()};const {error}=await sb.from('user_job_feedback').upsert(row,{onConflict:'job_id'});busy[id]=false;if(error){alert(error.message);return}state[id]={...next,application_date:row.application_date};render()}async function interest(id,v){const u=s(id);if(v==='no'){rejectOpen[id]=true;await save(id,{...u,interest:'no'});return}rejectOpen[id]=false;await save(id,{...u,interest:u.interest==='yes'?null:'yes',rejection_reason:''})}async function applied(id){const u=s(id),a=!u.applied;await save(id,{...u,applied:a,application_date:a?new Date().toISOString():null})}async function removeJob(id){const reason=($('reason-'+id)?.value||'').trim();const {error}=await sb.rpc('archive_and_delete_job',{p_job_id:Number(id),p_reason:reason});if(error){alert(error.message);return}delete state[id];data=data.filter(j=>j.id!==String(id));render()}function render(){counts();filters($('userFilters'),views,k=>view=k,view);filters($('aiFilters'),ais,k=>ai=k,ai);const rows=data.filter(j=>match(j)&&(ai==='ALL'||j.decision===ai));$('list').innerHTML=rows.length?'':'<div class="empty">'+(view==='PENDING'?'🎉 No tienes ofertas pendientes de analizar.':'No hay ofertas en esta vista.')+'</div>';for(const j of rows){const u=s(j.id),id=esc(j.id),el=document.createElement('article');el.className='card';el.innerHTML=`<div class="top"><div><span class="badge">${ais[j.decision]||'Sin evaluación IA'}</span><div class="title">${esc(j.title)}</div><div class="company">${esc(j.company)}</div><div class="meta">${esc(j.location)}</div></div><div><div class="score">${j.decision?Math.round(j.score):'–'}</div><div class="note">encaje / 100</div></div></div><div class="reason">${esc(j.reason)}</div><div class="quick"><button class="${u.interest==='yes'?'selected':''}" onclick="interest('${id}','yes')">♥ Me interesa</button><button class="danger ${u.interest==='no'?'selected':''}" onclick="interest('${id}','no')">No me interesa</button><button class="${u.applied?'selected':''}" onclick="applied('${id}')">✓ He aplicado</button></div><div class="rejectbox ${(rejectOpen[j.id]||u.interest==='no')?'open':''}"><input id="reason-${id}" value="${esc(u.rejection_reason||'')}" placeholder="¿Por qué no te interesa? (opcional)"><button class="deletebtn" onclick="removeJob('${id}')">Eliminar</button></div><div class="actions"><button class="btn" onclick="$('d-${id}').classList.toggle('open')">Ver ficha completa</button>${j.url?`<a class="btn secondary" href="${esc(j.url)}" target="_blank">Abrir oferta original</a>`:''}</div><div class="detail" id="d-${id}"><h3>Puntos fuertes</h3>${j.strengths?.length?'<ul>'+j.strengths.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'Sin observaciones'}<h3>Riesgos o gaps</h3>${j.gaps?.length?'<ul>'+j.gaps.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'Sin observaciones'}<h3>Descripción original</h3><div class="desc">${esc(j.description||'No disponible')}</div></div>`;$('list').appendChild(el)}}async function login(e){e.preventDefault();const {data:a,error}=await sb.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPassword').value});if(error){$('loginMessage').textContent='Error: '+error.message;return}show(a.session)}async function show(session){$('loginPanel').style.display='none';$('app').style.display='block';$('sessionEmail').textContent=session.user.email||'';await load()}async function boot(){sb=window.supabase.createClient(URL,KEY);$('loginForm').addEventListener('submit',login);$('logoutButton').onclick=async()=>{await sb.auth.signOut();location.reload()};const {data:{session}}=await sb.auth.getSession();if(session)show(session)}boot();
</script></body></html>
