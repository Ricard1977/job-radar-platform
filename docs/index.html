<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Radar</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:30px 18px}header{display:flex;justify-content:space-between;align-items:end;gap:20px}h1{margin:0;font-size:30px}.muted{color:#687386}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat,.card{background:#fff;border:1px solid #e1e6ef;border-radius:15px}.stat{padding:16px}.stat b{display:block;font-size:26px}.toolbar,.actions,.quick{display:flex;gap:8px;flex-wrap:wrap}.toolbar{margin:10px 0 18px}.toolbar button,.quick button{border:1px solid #d6dce7;background:#fff;padding:9px 13px;border-radius:999px;cursor:pointer}.toolbar button.active,.quick button.selected{background:#172033;color:#fff}.filter-title{font-size:12px;font-weight:700;color:#7b8493;margin-top:16px}.card{padding:21px;margin:13px 0}.top{display:flex;justify-content:space-between;gap:20px}.score{font-size:29px;font-weight:800}.badge{display:inline-block;font-size:12px;font-weight:750;padding:5px 9px;border-radius:999px;background:#edf1f6}.userbadge{margin-left:5px;background:#e9f5ed}.title{font-size:20px;font-weight:750;margin:6px 0}.company{font-weight:650}.meta,.reason{color:#5f697a;margin-top:8px}.reason{line-height:1.5}.quick{margin-top:14px;padding:11px 0;border-top:1px solid #edf0f4;border-bottom:1px solid #edf0f4}.quick .danger{border-color:#e2b8b8}.quick .delete{background:#8d3030;color:#fff;border-color:#8d3030}.actions{margin-top:14px}.btn{border:0;background:#172033;color:#fff;padding:9px 13px;border-radius:8px;text-decoration:none;cursor:pointer}.btn.secondary{background:#eef1f6;color:#172033}.detail{display:none;border-top:1px solid #e5e9f0;margin-top:18px;padding-top:18px}.detail.open{display:block}.detail h3{font-size:15px;margin:18px 0 7px}.detail p,.detail li{line-height:1.55}.desc{white-space:pre-wrap;max-height:420px;overflow:auto;background:#f7f8fb;padding:15px;border-radius:10px}.dimensions{display:flex;gap:7px;flex-wrap:wrap}.dim{background:#f2f4f8;border-radius:8px;padding:7px 9px;font-size:13px}.note{font-size:12px;color:#7b8493;margin-top:6px}.empty{text-align:center;padding:50px;color:#687386}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}header,.top{display:block}.score{margin-top:10px}}</style></head><body><div class="wrap"><header><div><h1>Job Radar</h1><div class="muted">Oportunidades priorizadas para tu revisión</div></div><div id="updated" class="muted"></div></header><div class="stats"><div class="stat"><b id="total">–</b>Analizadas</div><div class="stat"><b id="high">–</b>Muy interesantes</div><div class="stat"><b id="interesting">–</b>Interesantes IA</div><div class="stat"><b id="review">–</b>Revisar</div></div><div class="filter-title">MIS FILTROS</div><div class="toolbar" id="userFilters"></div><div class="filter-title">ENCAJE IA</div><div class="toolbar" id="aiFilters"></div><main id="list"><div class="empty">Cargando ofertas…</div></main></div><script>
const aiLabels={ALL:'Todas',HIGH_INTEREST:'🔥 Muy interesante',INTERESTING:'✅ Interesante',REVIEW:'🤔 Revisar',LOW_INTEREST:'⬇ Bajo interés'},userLabels={ALL:'Todas',MY_INTEREST:'❤️ Me interesa',APPLIED:'✓ He aplicado'};let data=[],aiActive='ALL',userActive='ALL';const state=JSON.parse(localStorage.getItem('jobRadarUserState')||'{}');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const listHtml=a=>a?.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<span class="muted">Sin observaciones.</span>';function s(id){return state[id]||(state[id]={interest:null,applied:false,applied_at:null,pending_delete:false})}function persist(){localStorage.setItem('jobRadarUserState',JSON.stringify(state))}function userMatch(j){const u=s(j.id);return userActive==='ALL'||(userActive==='MY_INTEREST'&&u.interest==='yes')||(userActive==='APPLIED'&&u.applied===true)}
function render(){const list=document.querySelector('#list'),rows=data.filter(x=>(aiActive==='ALL'||x.decision===aiActive)&&userMatch(x)&&!s(x.id).deleted);list.innerHTML=rows.length?'':'<div class="empty">No hay ofertas con estos filtros.</div>';for(const j of rows){const id=esc(j.id),u=s(j.id),dims=Object.entries(j.dimensions||{}).filter(x=>x[1]!=null).map(([k,v])=>`<span class="dim">${esc(k)}: <b>${Math.round(v)}</b></span>`).join(''),badges=(u.interest==='yes'?'<span class="badge userbadge">♥ Me interesa</span>':'')+(u.applied?'<span class="badge userbadge">✓ Aplicada</span>':'');const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="top"><div><span class="badge">${aiLabels[j.decision]||'Sin clasificar'}</span>${badges}<div class="title">${esc(j.title||'Sin título')}</div><div class="company">${esc(j.company||'')}</div><div class="meta">${esc([j.location,j.workplace_type,j.salary,j.source].filter(Boolean).join(' · '))}</div></div><div><div class="score">${Math.round(j.score||0)}</div><div class="note">encaje / 100</div></div></div><div class="reason">${esc(j.reason||'')}</div><div class="quick"><button class="${u.interest==='yes'?'selected':''}" onclick="setInterest('${id}','yes')">♥ Me interesa</button><button class="danger ${u.interest==='no'?'selected':''}" onclick="setInterest('${id}','no')">No me interesa</button><button class="${u.applied?'selected':''}" onclick="markApplied('${id}')">✓ He aplicado</button>${u.interest==='no'?`<button class="delete" onclick="removeJob('${id}')">Eliminar</button>`:''}</div><div class="actions"><button class="btn" onclick="toggle('${id}')">Ver ficha completa</button>${j.url?`<a class="btn secondary" href="${esc(j.url)}" target="_blank" rel="noopener">Abrir oferta original</a>`:''}</div><div class="detail" id="d-${id}"><h3>Resumen en castellano</h3><p>${esc(j.spanish_summary||'Se generará en la próxima evaluación.')}</p><h3>Análisis de encaje</h3><div class="dimensions">${dims}</div><h3>Puntos fuertes</h3>${listHtml(j.strengths)}<h3>Riesgos o gaps</h3>${listHtml(j.gaps)}<h3>Barreras</h3>${listHtml(j.barriers)}<h3>Descripción original</h3><div class="desc">${esc(j.description||'Descripción no disponible.')}</div></div>`;list.appendChild(el)}}
function toggle(id){document.querySelector('#d-'+id)?.classList.toggle('open')}function setInterest(id,v){const u=s(id);u.interest=u.interest===v?null:v;u.pending_delete=false;persist();render()}function markApplied(id){const u=s(id);if(!u.applied){u.applied=true;u.applied_at=new Date().toISOString()}persist();render()}function removeJob(id){if(!confirm('¿Eliminar esta oferta del Radar? Se conservará su identificación para evitar que vuelva a aparecer.'))return;const u=s(id);u.deleted=true;u.deleted_at=new Date().toISOString();persist();render()}
function makeFilters(el,obj,setter){for(const k of Object.keys(obj)){const b=document.createElement('button');b.textContent=obj[k];b.className=k==='ALL'?'active':'';b.onclick=()=>{[...el.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');setter(k);render()};el.appendChild(b)}}fetch('data/jobs.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{data=x.jobs||[];total.textContent=data.length;high.textContent=data.filter(j=>j.decision==='HIGH_INTEREST').length;interesting.textContent=data.filter(j=>j.decision==='INTERESTING').length;review.textContent=data.filter(j=>j.decision==='REVIEW').length;updated.textContent='Actualizado: '+new Date(x.generated_at).toLocaleString('es-ES');makeFilters(userFilters,userLabels,k=>userActive=k);makeFilters(aiFilters,aiLabels,k=>aiActive=k);render()}).catch(()=>list.innerHTML='<div class="empty">No se pudo cargar el dashboard.</div>');</script></body></html>
